<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lawn Schedule</title>
<style>
:root{--bg:#0e0e0e;--panel:#161616;--card:#111;--input:#0f0f0f;--border:#333;--border2:#2a2a2a;--text:#f5f5f5;--muted:#9a9a9a;--muted2:#777;--green:#5fd36d;--orange:#ffb347;--red:#ff5f57}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;display:flex;justify-content:center;padding:16px}
.app{width:min(100%,760px);min-height:480px;background:var(--panel);border:1px solid var(--border2);border-radius:16px;padding:18px}
h1,h2,h3{margin:0}h1{font-size:20px}h2{font-size:18px}h3{font-size:15px;color:var(--muted);font-weight:500}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.today-line{text-align:center;color:var(--muted);font-size:15px;font-weight:700;margin:0 0 14px}.today-line span{color:var(--text)}
.small-btn,.main-btn,.ghost-btn,.danger-btn{background:var(--input);color:var(--text);border:1px solid var(--border);border-radius:6px;min-height:38px;padding:8px 12px}
.main-btn{width:100%;font-weight:700;background:#132015;border-color:#254a2a}.danger-btn{color:#fff;background:var(--red);border-color:var(--red)}.ghost-btn{color:var(--muted)}
.next-card{background:var(--card);border:1px solid var(--border2);border-radius:12px;padding:16px;margin-bottom:16px}
.next-label{color:var(--muted);font-size:13px;margin-bottom:8px}.client-name{font-size:24px;font-weight:800;margin-bottom:4px}.suburb{color:var(--muted);margin-bottom:12px}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.pill{border-radius:999px;border:1px solid var(--border);padding:6px 10px;color:var(--muted);background:#0f0f0f;font-size:14px}.pill.due{color:var(--orange);border-color:#5b3f1a}.pill.overdue{color:var(--red);border-color:#5c2626}.pill.future{color:var(--green);border-color:#244f2a}
.notes{color:var(--muted);margin:8px 0 14px;line-height:1.35}.action-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 16px}.summary-box{background:#101010;border:1px solid #242424;border-radius:10px;padding:12px;text-align:center}.summary-num{font-size:22px;font-weight:800}.summary-label{color:var(--muted);font-size:13px;margin-top:3px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.tab{background:#0f0f0f;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:8px 4px}.tab.active{color:#fff;border-color:#f5f5f5;background:#242424}
.list{display:flex;flex-direction:column;gap:8px}.row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:#111;border:1px solid #242424;border-radius:8px;padding:10px}.row.next-row{border-color:#254a2a;background:#101710}.row.selected-row{border-color:#f5f5f5;background:#1b1b1b}.row-title{font-weight:700}.row-sub{color:var(--muted);font-size:14px;margin-top:3px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.row-right{text-align:right;color:var(--muted);font-size:14px}.price{color:var(--text);font-weight:700;margin-bottom:3px}.finish-small{background:#132015;border:1px solid #254a2a;color:#fff;border-radius:6px;padding:7px 12px;font-weight:800;margin-top:6px;min-height:34px}.edit-small{background:#0f0f0f;border:1px solid #333;color:var(--muted);border-radius:6px;padding:7px 12px;margin-top:6px;min-height:34px}.row-buttons{display:flex;gap:6px;justify-content:flex-end}.paid-btn{border-radius:6px;padding:7px 12px;font-weight:800;margin-top:6px;min-height:34px;border:1px solid #5b3f1a;background:#2a1f0d;color:var(--orange)}.paid-btn.paid-yes{border-color:#254a2a;background:#132015;color:var(--green)}.selected-actions{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.selected-actions button{min-height:38px}.paid-pop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);align-items:center;justify-content:center;padding:18px;z-index:50}.paid-pop.active{display:flex}.paid-box{width:min(100%,340px);background:#161616;border:1px solid #333;border-radius:14px;padding:18px;text-align:center}.paid-title{font-size:24px;font-weight:900;margin-bottom:14px}.paid-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.yes-btn{background:#132015;border:1px solid #254a2a;color:#fff;border-radius:6px;min-height:42px;font-weight:800}.no-btn{background:#0f0f0f;border:1px solid #333;color:var(--muted);border-radius:6px;min-height:42px}
.empty{color:var(--muted);padding:12px}.screen{display:none}.screen.active{display:block}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}label{color:var(--muted);font-size:13px}
input,textarea,select{background:var(--input);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:10px;outline:none;width:100%}textarea{min-height:72px;resize:vertical}
.form-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.footer-note{color:var(--muted2);font-size:12px;margin-top:14px;text-align:center}
@media(max-width:620px){body{padding:0}.app{min-height:100vh;border-radius:0;border:none}.tabs{grid-template-columns:repeat(2,1fr)}.form-grid,.action-row,.form-actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="app">
<section id="homeScreen" class="screen active">
<div class="top"><div><h1>Lawn Schedule</h1><h3>Who is next?</h3></div><button class="small-btn" id="addClientTop">+ Client</button></div>
<div class="today-line">Date today: <span id="todayDateText"></span></div>

<div id="clientList" class="list"></div><div class="footer-note">Top client is next. Tap Finished and they move forward by their repeat cycle.</div>
</section>
<section id="formScreen" class="screen">
<div class="top"><div><h1 id="formTitle">Add Client</h1><h3>Keep it simple</h3></div><button class="small-btn" id="backHome">Back</button></div>
<div class="form-grid">
<div class="field"><label>Name</label><input id="nameInput" placeholder="Mary" /></div>
<div class="field"><label>Suburb</label><input id="suburbInput" placeholder="Blacktown" /></div>
<div class="field"><label>Price $</label><input id="priceInput" type="number" placeholder="70" /></div>
<div class="field"><label>Repeat every</label><select id="cycleInput"><option value="7">7 days</option><option value="14">14 days</option><option value="21">21 days</option><option value="28">28 days</option><option value="30">30 days</option><option value="50">50 days</option></select></div>
<div class="field"><label>Next due date</label><input id="dueInput" type="date" /></div>
<div class="field full"><label>Notes</label><textarea id="notesInput" placeholder="Gate code, dog, green bin, cash, etc."></textarea></div>
</div>
<div class="form-actions"><button class="main-btn" id="saveClient">Save Client</button><button class="danger-btn" id="deleteClient" style="display:none">Delete Client</button></div>
</section>
<div class="paid-pop" id="paidPopup">
  <div class="paid-box">
    <div class="paid-title">Paid?</div>
    <div class="paid-actions">
      <button class="yes-btn" id="paidYesBtn">Yes</button>
      <button class="no-btn" id="paidNoBtn">No</button>
    </div>
  </div>
</div>
</main>
<script>
const STORAGE_KEY="lawnLoop.clients.v1";
let clients=[],activeFilter="all",editingId=null,selectedClientId=null,pendingPaidId=null;
const starter=[];
function today(){const d=new Date();d.setHours(0,0,0,0);return d}
function todayPretty(){return new Date().toLocaleDateString("en-AU",{weekday:"short",day:"numeric",month:"short",year:"numeric"})}
function addDays(date,days){const d=new Date(date);d.setDate(d.getDate()+Number(days));return d}
function iso(d){
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function pretty(s){return new Date(s+"T00:00:00").toLocaleDateString("en-AU",{weekday:"short",day:"numeric",month:"short"})}
function daysUntil(s){return Math.round((new Date(s+"T00:00:00")-today())/86400000)}
function dueText(s){const d=daysUntil(s);if(d<0)return Math.abs(d)+" day"+(Math.abs(d)==1?"":"s")+" overdue";if(d===0)return"Due today";if(d===1)return"Tomorrow";return"In "+d+" days"}
function dueClass(s){const d=daysUntil(s);return d<0?"overdue":d===0?"due":"future"}
function money(n){return "$"+Number(n||0).toLocaleString("en-AU",{maximumFractionDigits:0})}
function esc(s){return String(s||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function sort(list){return [...list].sort((a,b)=>new Date(a.nextDue)-new Date(b.nextDue))}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(clients))}
function load(){const raw=localStorage.getItem(STORAGE_KEY);if(raw){try{clients=JSON.parse(raw);clients=clients.map(c=>({...c,paid:c.paid===undefined?true:c.paid}));save();return}catch{}}const t=today();clients=starter.map((c,i)=>({id:(crypto.randomUUID?crypto.randomUUID():String(Date.now()+i)),name:c[0],suburb:c[1],price:c[2],cycle:c[3],nextDue:iso(addDays(t,c[4])),notes:c[5],paid:true}));save()}
function matches(c){const d=daysUntil(c.nextDue);if(activeFilter==="today")return d<=0;if(activeFilter==="week")return d<=7;if(activeFilter==="month")return d<=30;return true}
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));document.getElementById(id).classList.add("active")}
function render(){document.getElementById("todayDateText").textContent=todayPretty();const sorted=sort(clients);renderList(sorted)}
function renderNext(c){const el=document.getElementById("nextCard");if(!c){el.innerHTML='<div class="next-label">NEXT TO CUT</div><div class="client-name">No clients yet</div><div class="suburb">Add a client to start the loop.</div>';return}el.innerHTML='<div class="next-label">NEXT TO CUT</div><div class="client-name">'+esc(c.name)+'</div><div class="suburb">'+esc(c.suburb)+'</div><div class="meta-row"><span class="pill '+dueClass(c.nextDue)+'">'+dueText(c.nextDue)+'</span><span class="pill">'+pretty(c.nextDue)+'</span><span class="pill">'+money(c.price)+'</span><span class="pill">Every '+c.cycle+' days</span></div><div class="notes">'+esc(c.notes)+'</div><div class="action-row"><button class="main-btn" onclick="finishClient(\''+c.id+'\')">Finished</button><button class="ghost-btn" onclick="editClient(\''+c.id+'\')">Edit</button></div>'}
function renderList(list){const el=document.getElementById("clientList");el.innerHTML="";if(!list.length){el.innerHTML='<div class="empty">No clients yet. Add one to start the schedule.</div>';return}list.forEach((c,index)=>{const row=document.createElement("div");row.className="row"+(index===0?" next-row":"")+(selectedClientId===c.id?" selected-row":"");const isSelected=selectedClientId===c.id;const paidClass=c.paid?"paid-yes":"";const paidBtn='<button class="paid-btn '+paidClass+'" onclick="event.stopPropagation();openPaidPopup(\''+c.id+'\')">Paid</button>';const actions=isSelected?'<div class="selected-actions"><button class="finish-small" onclick="event.stopPropagation();finishClient(\''+c.id+'\')">Finished</button><button class="edit-small" onclick="event.stopPropagation();editClient(\''+c.id+'\')">Edit</button></div>':'';row.innerHTML='<div><div class="row-title">'+(index===0?'NEXT - ':'')+esc(c.name)+'</div><div class="row-sub">'+esc(c.suburb)+' · '+dueText(c.nextDue)+' · every '+c.cycle+' days</div></div><div class="row-right"><div class="price">'+money(c.price)+'</div><div>'+pretty(c.nextDue)+'</div>'+paidBtn+'</div>'+actions;row.onclick=()=>selectClient(c.id);el.appendChild(row)})}
function selectClient(id){selectedClientId=selectedClientId===id?null:id;render()}
function finishClient(id){const c=clients.find(x=>x.id===id);if(!c)return;c.nextDue=iso(addDays(today(),c.cycle));c.paid=false;selectedClientId=null;save();render();scrollTo({top:0,behavior:"smooth"})}
function editClient(id){const c=clients.find(x=>x.id===id);if(!c)return;editingId=id;formTitle.textContent="Edit Client";nameInput.value=c.name;suburbInput.value=c.suburb;priceInput.value=c.price;cycleInput.value=c.cycle;dueInput.value=c.nextDue;notesInput.value=c.notes||"";deleteClient.style.display="block";show("formScreen")}
function addClient(){editingId=null;formTitle.textContent="Add Client";nameInput.value="";suburbInput.value="";priceInput.value="";cycleInput.value="14";dueInput.value=iso(today());notesInput.value="";deleteClient.style.display="none";show("formScreen")}
function saveClientForm(){const name=nameInput.value.trim();if(!name)return;const data={name,suburb:suburbInput.value.trim(),price:Number(priceInput.value)||0,cycle:Number(cycleInput.value)||14,nextDue:dueInput.value||iso(today()),notes:notesInput.value.trim()};if(editingId){const c=clients.find(x=>x.id===editingId);if(c)Object.assign(c,data)}else clients.push({id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())),paid:true,...data});save();render();show("homeScreen")}
function deleteClientForm(){if(!editingId)return;if(!confirm("Delete this client?"))return;clients=clients.filter(c=>c.id!==editingId);selectedClientId=null;save();render();show("homeScreen")}
function openPaidPopup(id){pendingPaidId=id;paidPopup.classList.add("active")}
function closePaidPopup(){pendingPaidId=null;paidPopup.classList.remove("active")}
function markPaidYes(){if(!pendingPaidId){closePaidPopup();return}const c=clients.find(x=>x.id===pendingPaidId);if(c){c.paid=true;save();render()}closePaidPopup()}
addClientTop.onclick=addClient;backHome.onclick=()=>show("homeScreen");saveClient.onclick=saveClientForm;deleteClient.onclick=deleteClientForm;paidYesBtn.onclick=markPaidYes;paidNoBtn.onclick=closePaidPopup;

load();render();
</script>
</body>
</html>
